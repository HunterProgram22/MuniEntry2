{% extends 'base.html' %}

{% block title %}Select User - MuniEntry{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Select Court Staff Member</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        {% for user in users %}
                        <div class="col-md-6 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="selected_user"
                                       id="user_{{ forloop.counter }}" value="{{ user.name }}" required>
                                <label class="form-check-label" for="user_{{ forloop.counter }}">
                                    <strong>{{ user.name }}</strong><br>
                                    <small class="text-muted">{{ user.role }}</small>
                                </label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">Continue to MuniEntry</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
